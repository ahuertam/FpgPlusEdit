<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPG+ Edit — recursos gráficos de DIV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="logo">FPG+</span>
    <span class="brand-sub">editor de recursos de DIV&nbsp;Games&nbsp;Studio&nbsp;2</span>
  </div>

  <div class="filebox">
    <input id="pathInput" type="text" spellcheck="false" placeholder="Ruta del fichero (.FPG .MAP .PAL .FNT)">
    <button id="btnOpen" class="btn">Abrir</button>
    <button id="btnBrowse" class="btn ghost">Examinar…</button>
  </div>

  <div class="actions">
    <button id="btnNew" class="btn ghost">Nuevo FPG</button>
    <button id="btnSave" class="btn ghost" disabled>Guardar</button>
    <button id="btnSaveAs" class="btn ghost" disabled>Guardar como…</button>
    <button id="btnExport" class="btn ghost" disabled>Exportar…</button>
    <button id="btnImport" class="btn ghost" disabled>Importar imagen…</button>
  </div>
</header>

<main class="layout">

  <!-- Columna izquierda: ficheros + mapas -->
  <aside class="col left">
    <section class="panel" id="panelFiles">
      <h2>Ficheros</h2>
      <div class="crumbs">
        <button id="btnUp" class="mini" title="Subir un nivel">▲</button>
        <span id="crumbPath" class="crumb">—</span>
      </div>
      <ul id="fileList" class="filelist"></ul>
    </section>

    <section class="panel" id="panelMaps">
      <h2>Mapas <span id="mapsCount" class="count"></span></h2>
      <ul id="mapList" class="maplist"></ul>
    </section>
  </aside>

  <!-- Centro: lienzo -->
  <section class="col center">
    <div class="toolbar">
      <span class="tag" id="docKind">sin fichero</span>
      <span class="spacer"></span>
      <label>Zoom
        <select id="zoomSel">
          <option value="1">1×</option>
          <option value="2" selected>2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
          <option value="6">6×</option>
          <option value="8">8×</option>
        </select>
      </label>
      <label>Fotograma
        <select id="frameSel"><option value="0">0</option></select>
      </label>
      <label class="chk"><input id="gridChk" type="checkbox"> Rejilla</label>
      <span class="readout" id="readout">—</span>
    </div>

    <div class="stage" id="stage">
      <canvas id="view" width="16" height="16"></canvas>
      <p class="empty" id="emptyMsg">Abre un <b>FPG</b>, <b>MAP</b>, <b>PAL</b> o <b>FNT</b> para empezar.</p>
    </div>
  </section>

  <!-- Columna derecha: paleta + propiedades -->
  <aside class="col right">
    <section class="panel">
      <h2>Paleta</h2>
      <div id="palette" class="palette"></div>
      <div class="pal-edit">
        <div class="pal-preview" id="palPreview"></div>
        <div class="pal-fields">
          <label>Índice <output id="palIndex">0</output></label>
          <label>R <input id="palR" type="range" min="0" max="63" value="0"><output id="palRv">0</output></label>
          <label>G <input id="palG" type="range" min="0" max="63" value="0"><output id="palGv">0</output></label>
          <label>B <input id="palB" type="range" min="0" max="63" value="0"><output id="palBv">0</output></label>
          <button id="palApply" class="btn small" disabled>Aplicar color</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Propiedades</h2>
      <dl id="props" class="props"><dt>—</dt><dd>Nada abierto</dd></dl>
    </section>
  </aside>
</main>

<div class="toast" id="toast"></div>

<!-- Diálogo de apertura -->
<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <header>
      <h3>Abrir fichero</h3>
      <button id="modalClose" class="mini">✕</button>
    </header>
    <div class="crumbs">
      <button id="mUp" class="mini">▲</button>
      <span id="mPath" class="crumb">—</span>
    </div>
    <ul id="mList" class="filelist"></ul>
    <footer>
      <input id="mManual" type="text" spellcheck="false" placeholder="…o escribe una ruta y pulsa Abrir">
      <button id="mOpen" class="btn">Abrir ruta</button>
    </footer>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
